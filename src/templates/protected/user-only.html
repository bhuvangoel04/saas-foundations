{% extends "base.html" %}

{% block title %}
User Area - SaaS Foundations
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12 px-4 relative">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-emerald-500/5 rounded-full blur-[80px] pointer-events-none"></div>

    <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl shadow-2xl p-8 text-center relative z-10 backdrop-blur-md">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
        </div>

        <h1 class="text-3xl font-extrabold text-white mb-2">Access Granted</h1>
        <p class="text-emerald-400 font-semibold mb-4 text-sm">Welcome, {{ request.user.username }}!</p>
        
        <p class="text-zinc-400 text-sm mb-8 leading-relaxed">
            You have successfully verified your credentials. This is a secure, user-only area.
        </p>

        <a href="/" class="inline-block bg-zinc-800 hover:bg-zinc-700 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 border border-zinc-700 text-sm">
            Go to Dashboard
        </a>
    </div>
</div>
{% endblock content %}
