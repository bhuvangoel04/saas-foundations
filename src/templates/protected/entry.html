{% extends "base.html" %}

{% block title %}
Password Protected - SaaS Foundations
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12 px-4 relative">
    <!-- Subtle Background Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-emerald-500/5 rounded-full blur-[80px] pointer-events-none"></div>

    <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl shadow-2xl p-8 relative z-10 backdrop-blur-md">
        <div class="text-center mb-8">
            <span class="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
                Protected Area
            </span>
            <h2 class="text-3xl font-extrabold text-white mt-4">Verification Required</h2>
            <p class="text-zinc-400 text-sm mt-2">Enter the authorization code to view this page.</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="code" class="block text-zinc-300 text-xs font-semibold uppercase tracking-wider mb-2">Access Code</label>
                <div class="relative">
                    <input type="password" id="code" name="code" placeholder="Enter code" required
                           class="w-full bg-zinc-950 border border-zinc-800 focus:border-emerald-500 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-emerald-500 transition duration-200">
                </div>
            </div>

            <button type="submit" 
                    class="w-full bg-emerald-400 hover:bg-emerald-300 text-black font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-400/10 hover:shadow-emerald-400/20 transition-all duration-200 text-sm">
                Verify & Enter
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-zinc-800/80 text-center">
            <a href="/" class="text-zinc-400 hover:text-white text-sm font-medium transition duration-150">
                &larr; Return to Home
            </a>
        </div>
    </div>
</div>
{% endblock content %}
