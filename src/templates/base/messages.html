{% load i18n %}
{% if messages %}
<div class="max-w-screen-xl mx-auto px-4 mt-6">
    {% for message in messages %}
    <div id="alert-{{ forloop.counter }}" class="flex items-center p-4 mb-4 rounded-xl border bg-zinc-900 {% if 'success' in message.tags %}border-emerald-500/20 text-emerald-400 bg-emerald-500/5{% else %}border-rose-500/20 text-rose-400 bg-rose-500/5{% endif %}" role="alert">
        <svg class="flex-shrink-0 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
        </svg>
        <div class="ms-3 text-sm font-medium">
            {{ message }}
        </div>
        <button type="button" class="ms-auto -mx-1.5 -my-1.5 rounded-lg p-1.5 inline-flex items-center justify-center h-8 w-8 text-current hover:bg-white/10" aria-label="Close" onclick="document.getElementById('alert-{{ forloop.counter }}').remove()">
            <span class="sr-only">Close</span>
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
